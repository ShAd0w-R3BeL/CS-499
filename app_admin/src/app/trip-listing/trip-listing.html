<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <a class="btn btn-primary" href="/add-trip">Add Trip</a>
  </div>

  <div class="card mb-4">
    <div class="card-body">
      <h5 class="card-title">Search and Filter Trips</h5>

      <div class="row g-3">

        <div class="col-md-4">
          <label class="form-label" for="searchTerm">
            Search
          </label>

          <input
            id="searchTerm"
            type="text"
            class="form-control"
            placeholder="Code, name, or resort"
            [(ngModel)]="searchTerm"
            (ngModelChange)="applyFilters()"
          >
        </div>

        <div class="col-md-4">
          <label class="form-label" for="resortFilter">
            Resort
          </label>

          <select
            id="resortFilter"
            class="form-select"
            [(ngModel)]="resortFilter"
            (ngModelChange)="applyFilters()"
          >
            <option value="">All Resorts</option>

            @for (resort of getResorts(); track resort) {
              <option [value]="resort">
                {{ resort }}
              </option>
            }
          </select>
        </div>

        <div class="col-md-2">
          <label class="form-label" for="sortField">
            Sort By
          </label>

          <select
            id="sortField"
            class="form-select"
            [(ngModel)]="sortField"
            (ngModelChange)="applyFilters()"
          >
            <option value="name">Name</option>
            <option value="start">Start Date</option>
            <option value="perPerson">Price</option>
          </select>
        </div>

        <div class="col-md-2">
          <label class="form-label" for="sortDirection">
            Direction
          </label>

          <select
            id="sortDirection"
            class="form-select"
            [(ngModel)]="sortDirection"
            (ngModelChange)="applyFilters()"
          >
            <option value="asc">Ascending</option>
            <option value="desc">Descending</option>
          </select>
        </div>

      </div>

      <div class="mt-3">
        <button
          type="button"
          class="btn btn-secondary"
          (click)="clearFilters()"
        >
          Clear Filters
        </button>
      </div>
    </div>
  </div>

  <p>{{ message() }}</p>

  <div class="row">
    @for (trip of trips(); track trip.code) {
      <div class="col-md-4 mb-4">
        <app-trip-card [trip]="trip"></app-trip-card>
      </div>
    }
  </div>
</div>
